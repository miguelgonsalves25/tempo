<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você Decide o Futuro da IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #f0f6fc;
        }

        /* Estilo do cartão principal */
        .card-main {
            background-color: #21262d;
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Botões customizados */
        .btn-opcao {
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #f0f6fc;
            transition: all 0.2s ease-in-out;
        }

        .btn-opcao:hover {
            border-color: #a855f7;
            background-color: #2d1d3f;
            transform: translateY(-2px);
        }

        .btn-primario {
            background-color: #a855f7;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .btn-primario:hover {
            background-color: #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }

        /* Animação suave para troca de telas */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Container Principal -->
    <main class="w-full max-w-xl card-main rounded-2xl p-6 sm:p-8 relative overflow-hidden">
        
        <!-- Cabeçalho do Site -->
        <header class="text-center mb-6">
            <span class="inline-block px-3 py-1 bg-[#2d1d3f] text-[#c084fc] rounded-full text-xs font-semibold tracking-wider uppercase mb-2 border border-[#a855f7]/30">
                Jogo Interativo
            </span>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-[#f0f6fc]">
                Você Decide o Futuro da <span class="text-[#c084fc]">IA</span>
            </h1>
        </header>

        <!-- Barra de Progresso Simplificada -->
        <div id="container-progresso" class="hidden mb-6">
            <div class="flex justify-between text-xs text-gray-400 font-medium mb-2">
                <span id="texto-progresso">Pergunta 1 de 3</span>
                <span id="porcentagem-progresso">33%</span>
            </div>
            <div class="w-full h-2 bg-[#161b22] rounded-full overflow-hidden border border-[#30363d]">
                <div id="barra-progresso" class="h-full bg-[#2dd4bf] transition-all duration-300 rounded-full" style="width: 33%;"></div>
            </div>
        </div>

        <!-- 1. TELA INICIAL -->
        <section id="tela-inicial" class="fade-in text-center space-y-6">
            <p class="text-gray-300 text-sm sm:text-base leading-relaxed bg-[#161b22] p-4 rounded-xl border border-[#30363d] text-left">
                A Inteligência Artificial está transformando o mundo rapidamente. Suas pequenas escolhas do dia a dia vão definir se teremos um futuro seguro ou fora de controle. Pronto para decidir o nosso destino?
            </p>
            <button id="btn-iniciar" class="btn-primario w-full py-3.5 px-6 rounded-xl font-bold text-base shadow-lg">
                Iniciar Simulação
            </button>
        </section>

        <!-- 2. TELA DE PERGUNTAS -->
        <section id="tela-perguntas" class="hidden fade-in space-y-5">
            <div id="caixa-pergunta" class="text-lg sm:text-xl font-semibold text-[#f0f6fc] leading-snug">
                <!-- Texto da Pergunta entra via JS -->
            </div>

            <div id="caixa-alternativas" class="flex flex-col gap-3">
                <!-- Botões de Opção entram via JS -->
            </div>
        </section>

        <!-- 3. TELA DE RESULTADO -->
        <section id="tela-resultado" class="hidden fade-in text-center space-y-6">
            <div class="bg-[#161b22] p-6 rounded-xl border border-[#
